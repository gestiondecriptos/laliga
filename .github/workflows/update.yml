name: Actualizar datos
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node probe.js
      - name: Guardar debug.json
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add debug.json
          git diff --staged --quiet || (git commit -m "Prueba MyScorePrediction" && git pull --rebase && git push)
